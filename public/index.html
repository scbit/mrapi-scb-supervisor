<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUPERVISOR SCB V3</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color:#172033; background:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(720px,100%); background:#fff; border:1px solid #dfe5ef; border-radius:18px; padding:30px; box-shadow:0 10px 30px rgba(20,34,60,.08); }
    h1 { margin:0 0 8px; font-size:30px; }
    .meta { color:#667085; margin-bottom:24px; line-height:1.6; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    a { text-decoration:none; border-radius:10px; padding:12px 18px; font-weight:700; display:inline-block; }
    .primary { background:#172033; color:#fff; }
    .secondary { background:#eef2f7; color:#172033; border:1px solid #d9e0ea; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SUPERVISOR SCB V3</h1>
    <div class="meta">
      Roadmap 1 — Core de Supervisión Comercial<br>
      Versión <strong>0.5.7</strong>
    </div>
    <div class="actions">
      <a class="primary" href="/validate">Ir a Validación / Core</a>
      <a class="secondary" href="/health">Health</a>
    </div>
  </main>
</body>
</html>
